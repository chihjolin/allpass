#定義 common 為一個 package
[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "common"
version = "0.1.0"
description = "Shared utilities for allpass project"
authors = [{ name = "allpassteam", email = "allpassteam@email.com" }]
readme = "README.md"
license = { text = "MIT" }
dependencies = ["sqlalchemy", "psycopg2-binary", "python-dotenv"]

[tool.setuptools.packages.find]
where = ["."]
include = ["*"]