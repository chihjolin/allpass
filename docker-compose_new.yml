version: '3.8'

services:
  #Redis 快取服務
  redis:
    image: redis:7-alpine
    container_name: allpass_redis_container
    env_file:
      - ./.env
    volumes:
      - redis_data:/data
    ports:
      - "${REDIS_HOST_PORT:-6379}:${REDIS_PORT:-6379}"
    networks:
      - allpass-network
    restart: unless-stopped

  #Postgres(postgis) 服務
  postgis:
    image: postgis/postgis:16-3.4
    container_name: allpass_postgis_container
    env_file:
      - ./.env
    volumes:
      - postgis_data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d
    ports:
      - "${POSTGRES_HOST_PORT:-5432}:${POSTGRES_PORT:-5432}"
    networks:
      - allpass-network
    restart: unless-stopped
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-allpass_user} -d ${POSTGRES_DB:-allpass_db}" ]
      interval: 10s
      timeout: 5s
      retries: 5

  #Backend 服務
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: allpass_backend_container
    env_file:
      - ./.env
    volumes:
        - ./common:/app/common   # 開發時熱更新   # 掛載共用模組 #生產環境通常不掛載 volume
        - ./backend:/app/backend # 開發時熱更新
    ports:
      - "${FLASK_HOST_PORT:-5000}:${FLASK_PORT:-5000}"
    networks:
      - allpass-network
    depends_on:
      postgis:
        condition: service_healthy
      redis:
        condition: service_started
      etl:
        condition: service_completed_successfully   # 等ETL成功才啟動

    restart: unless-stopped
    healthcheck:
      test: [ "CMD-SHELL", "curl -f http://localhost:${FLASK_PORT:-5000}/health || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 5

  #Frontend 服務
  frontend:
    build: ./frontend
    container_name: allpass_frontend_container
    env_file:
      - ./.env
    ports:
      - "${WEB_HOST_PORT:-80}:${WEB_PORT:-80}"
    networks:
      - allpass-network
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped


  #ETL 
  etl:
    build: 
      context: .
      dockerfile: etl/Dockerfile
    container_name: allpass_etl_container
    env_file:
      - ./.env
    volumes:
      - ./etl:/app/etl         # 開發時熱更新 ETL 程式碼
      - ./common:/app/common   # 開發時熱更新 common
    networks:
      - allpass-network
    depends_on:
      postgis:
        condition: service_healthy
    # command: ["python", "-m", "init.init_postgres"]
    # restart: "no"   # ETL 是一次性 job，跑完就結束


  #LLM
  llm:
    build: 
      context: .
      dockerfile: aiservices/llm/Dockerfile
    container_name: allpass_llm_container
    env_file:
      - ./.env
    volumes:
      - ./aiservices/llm:/app
      - ./common:/app/common   # 共用模組
    depends_on:
      postgis:
        condition: service_healthy
    ports:
      - "8000:8000"
    networks:
      - allpass_net



  #Recommendation


  #Time_Prediction


  #Training







volumes:
  postgis_data:
    name: allpass_postgis_data
  redis_data:
    name: allpass_redis_data

networks:
  allpass-network:
    driver: bridge
