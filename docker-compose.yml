version: '3.8'

services:
  #Redis 快取服務
  redis:
    image: redis:7-alpine
    container_name: allpass_redis_container
    env_file:
      - ./.env
    volumes:
      - redis_data:/data
    ports:
      - "${REDIS_HOST_PORT:-6379}:${REDIS_PORT:-6379}"
    networks:
      - allpass-network
    restart: unless-stopped

  #Postgres(postgis) 服務
  postgis:
    image: postgis/postgis:16-3.4
    container_name: allpass_postgis_container
    env_file:
      - ./.env
    volumes:
      - postgis_data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d
    ports:
      - "${POSTGRES_HOST_PORT:-5432}:${POSTGRES_PORT:-5432}"
    networks:
      - allpass-network
    restart: unless-stopped
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-allpass_user} -d ${POSTGRES_DB:-allpass_db}" ]
      interval: 10s
      timeout: 5s
      retries: 5

  #ETL:
  etl:
    build:
      context: .
      dockerfile: etl/Dockerfile
    container_name: allpass_etl_container
    env_file:
      - ./.env
    volumes:
      # 熱更新 ETL 程式碼
      - ./etl:/app/etl
      # # 熱更新 common package
      # - ./common:/app/common
    networks:
      - allpass-network
    depends_on:
      redis:
        condition: service_started
      postgis:
        condition: service_healthy
    working_dir: /app

  #Backend 服務
  backend:
    build: 
      context: .
      dockerfile: backend/Dockerfile
    container_name: allpass_backend_container
    env_file:
      - ./.env
    ports:
      - "${FLASK_HOST_PORT:-5000}:${FLASK_PORT:-5000}"
    networks:
      - allpass-network
    depends_on:
      postgis:
        condition: service_healthy
      redis:
        condition: service_started
      etl:
        condition: service_completed_successfully   # 等ETL成功才啟動      
    restart: unless-stopped
    healthcheck:
      test: [ "CMD-SHELL", "curl -f http://localhost:${FLASK_PORT:-5000}/health || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 5

  #Frontend 服務
  frontend:
    build: ./frontend
    container_name: allpass_frontend_container
    env_file:
      - ./.env
    ports:
      - "${WEB_HOST_PORT:-80}:${WEB_PORT:-80}"
    networks:
      - allpass-network
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  #Training:
  training:
    build: 
      context: .
      dockerfile: training/Dockerfile
    container_name: allpass_training_container
    env_file:
      - ./.env
    volumes:
      - ./models:/app/models
    networks:
      - allpass-network
    depends_on:
      postgis:
        condition: service_healthy
      etl:
        condition: service_completed_successfully   # 等ETL成功才啟動

  #Time_Prediction
  time_prediction:
    build: 
      context: .
      dockerfile: aiservices/time_prediction/Dockerfile
    container_name: allpass_time_prediction_container
    env_file:
      - ./.env
    volumes:
      - ./models:/app/models:ro #ro (read-only)
    networks:
      - allpass-network
    ports:
      - "${TIME_PREDICTION_HOST_PORT:-8000}:${TIME_PREDICTION_PORT:-8000}"
    # depends_on:
    #   training:
    #     condition: service_completed_successfully # 等training成功才啟動


  mlflow:
    build:
      context: ./services/mlflow
      dockerfile: Dockerfile
    #image: ghcr.io/mlflow/mlflow:v2.13.2 # 建議指定明確的版本
    container_name: allpass_mlflow_container
    env_file:
      - ./.env
    volumes:
      - ./mlruns:/mlruns # 將實驗紀錄掛載到本機，避免容器重啟後遺失
    ports:
      - "${MLFLOW_HOST_PORT:-5001}:${MLFLOW_PORT:-5000}" # 將主機 5001 port 映射到容器 5000 port
    networks:
      - allpass-network
    environment:
      - MLFLOW_SERVER_DEFAULT_ARTIFACT_ROOT=/mlruns # 告訴 MLflow 將模型等產物存在 /mlruns
    depends_on:
      postgis:
          condition: service_healthy
    command: >
      mlflow server
      --host 0.0.0.0
      --port ${MLFLOW_PORT:-5000}
      --backend-store-uri postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgis:${POSTGRES_PORT:-5432}/${MLFLOW_DB:-mlflow_db}
      --default-artifact-root /mlruns


volumes:
  postgis_data:
    name: allpass_postgis_data
  redis_data:
    name: allpass_redis_data

networks:
  allpass-network:
    driver: bridge